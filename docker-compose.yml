services:

  env-base:
    image: ghcr.io/inginious/env-base:latest
    attach: false
    build:
      context: base-containers/base/
      target: env-base
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io
    command: /bin/true

  env-default:
    image: ghcr.io/inginious/env-default:latest
    attach: false
    build:
      context: base-containers/base/
      target: env-default
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io
    command: /bin/true

  env-inleiding-programmeren:
    image: ghcr.io/uantwerpen/inginious/env-inleiding-programmeren:latest
    attach: false
    depends_on:
      env-base:
        condition: service_completed_successfully
    build:
      context: uantwerpen/containers/inleiding-programmeren/
      target: env-cpp  # Dockerfile stage name (FROM ... AS env-cpp)
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io
    command: /bin/true

  env-computer-graphics:
    image: ghcr.io/uantwerpen/inginious/env-computer-graphics:latest
    attach: false
    depends_on:
      env-base:
        condition: service_completed_successfully
    build:
      context: uantwerpen/containers/computer-graphics/
      target: env-computer-graphics
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io
    command: /bin/true

  env-computer-systemen-architectuur:
    image: ghcr.io/uantwerpen/inginious/env-computer-systemen-architectuur:latest
    attach: false
    depends_on:
      env-base:
        condition: service_completed_successfully
    build:
      context: uantwerpen/containers/computer-systemen-architectuur/
      target: env-computer-systemen-architectuur
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io
    command: /bin/true

  db:
    image: mongo:6.0.2
    volumes:
      - ./db:/data/db:z
      - ./deploy/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:z
    environment:
      MONGO_INITDB_DATABASE: "INGInious"

      # MANDATORY ARGUMENT, INITIALISATION WILL FAIL IF NOT PROVIDED.
      # Output of 'echo -n "superadmin" | argon2  ASUPERSECURESALT -id -t 3 -m 16 -l 64 -e'.
      # $ are doubled because of variable expansion in compose env var.
      INGINIOUS_SUPERADMIN_PASSWORD: '$$argon2id$$v=19$$m=65536,t=3,p=1$$QVNVUEVSU0VDVVJFU0FMVA$$NpeSDEsx+FwrIS277T9o/Q4z4Ypicibs3LiLZrftXsBUmBxFnK8FKa45w5q85ewM+dOlzZPMFdAmxpmDVAmLlQ'

      # Username. Defaults to "superadmin" if not provided.
      INGINIOUS_SUPERADMIN_USERNAME: "superadmin"

      # Real name. Defaults to "INGInious superadmin" if not provided.
      INGINIOUS_SUPERADMIN_REALNAME: "INGInious superadmin"

      # Email. Defaults to "superadmin@inginious.org" if not provided.
      INGINIOUS_SUPERADMIN_EMAIL: "superadmin@inginious.org"

      # Optionnal superadmin language
      # INGINIOUS_SUPERADMIN_LANG: "en"
      #
      # Optionnal superadmin code indentation
      # INGINIOUS_SUPERADMIN_INDENT: "4"
    networks:
      - inginious

  backend:
    image: ghcr.io/uantwerpen/inginious/core-backend:latest
    build:
      dockerfile: deploy/Containerfile
      target: backend
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io/uantwerpen
    environment:
      AGENT: "tcp://0.0.0.0:2001"
      CLIENT: "tcp://0.0.0.0:2000"
    networks:
      - inginious

  agent-docker:
    image: ghcr.io/uantwerpen/inginious/core-agent_docker:latest
    depends_on:
      backend:
        condition: service_started
      env-base:
        condition: service_completed_successfully
      env-default:
        condition: service_completed_successfully
      env-inleiding-programmeren:
        condition: service_completed_successfully
      env-computer-graphics:
        condition: service_completed_successfully
      env-computer-systemen-architectuur:
        condition: service_completed_successfully
    deploy:
      replicas: 1
    build:
      dockerfile: deploy/Containerfile
      target: agent_docker
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io/uantwerpen
    environment:
      BACKEND: "tcp://backend:2001"
    security_opt:
      - "label=disable"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:z
      # See https://github.com/INGInious/INGInious/issues/352
      - ./uantwerpen/courses:/inginious/tasks:z
      # See https://github.com/INGInious/INGInious/issues/799
      - /tmp/agent_data:/tmp/agent_data:z
    networks:
      - inginious

  agent-mcq:
    image: ghcr.io/inginious/core-agent_mcq:latest
    depends_on:
      backend:
        condition: service_started
    deploy:
      replicas: 1
    build:
      dockerfile: deploy/Containerfile
      target: agent_mcq
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io
    environment:
      BACKEND: "tcp://backend:2001"
    volumes:
      # See https://github.com/INGInious/INGInious/issues/352
      - ./tasks:/inginious/tasks:z
      # See https://github.com/INGInious/INGInious/issues/799
      - /tmp/agent_data:/tmp/agent_data:z
    networks:
      - inginious

  frontend:
    image: ghcr.io/uantwerpen/inginious/core-frontend:latest
    build:
      dockerfile: deploy/Containerfile
      target: frontend
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io/uantwerpen
    depends_on:
      db:
        condition: service_started
      backend:
        condition: service_started
    environment:
      - INGINIOUS_WEBAPP_HOST=0.0.0.0
      # DEV ONLY: enables GET /dev-login (see dev_auth plugin). Remove for prod.
      - INGINIOUS_DEV_LOGIN=1
    volumes:
      - ./configuration.deploy.yaml:/inginious/configuration.yaml:z
      # Mounted on /inginious (the container workdir, on sys.path) so that:
      #  - tasks_directory "uantwerpen/courses" resolves, and
      #  - the "uantwerpen.plugins.*" plugin modules are importable.
      - ./uantwerpen:/inginious/uantwerpen:z
    networks:
      - inginious

  webdav:
    image: ghcr.io/inginious/core-webdav:latest
    build:
      dockerfile: deploy/Containerfile
      target: webdav
      args:
        - VERSION=latest
        - REGISTRY=ghcr.io
    environment:
      - INGINIOUS_WEBDAV_HOST=0.0.0.0
    depends_on:
      - db
    volumes:
      - ./configuration.deploy.yaml:/inginious/configuration.yaml:z
      # Same rationale as the frontend service (tasks_directory + plugin imports).
      - ./uantwerpen:/inginious/uantwerpen:z
    networks:
      - inginious

  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:z
    depends_on:
      - frontend
      - webdav
    ports:
      - 443:443
    # For illustration purpose, not useful in real deployments.
    networks:
      inginious:
        aliases:
          - inginious.local
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
      start_interval: 5s

networks:
  inginious:
