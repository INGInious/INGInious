name: "CD: Env containers"

on:
  push:
    branches: [main]
  release:
    types: [published]

  workflow_dispatch:

jobs:
  containers_build_and_push:
    runs-on: ubuntu-24.04

    env:
      REGISTRY: "ghcr.io"
      VERSION: "${{ github.event_name == 'push' && github.ref_name || github.event.release.tag_name }}"

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push base environments
        working-directory: base-containers/base
        run: for stage in base default python3; do docker build --target=env-${stage} -t ${REGISTRY}/inginious/env-${stage}:${VERSION} --push . ; done
