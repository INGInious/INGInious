name: Build and push docker-compose images

on:
  push:
    branches:
      - main
    paths:
      - deploy/Containerfile
      - uantwerpen/containers/**
      - inginious/**
      - pyproject.toml

  # Builds every image, e.g. after changing this workflow or to pick up a new
  # upstream env-base, which a push does not detect.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io/uantwerpen
  VERSION: ${{ github.sha }}
  # Upstream base env image tag to build our grading containers FROM.
  # "main" is the Rocky 10 base; "latest" is an outdated Rocky 8 image.
  UPSTREAM_ENV_TAG: main

jobs:
  # Only the images affected by a push are built: docker-compose.yml uses the
  # :latest tag of each image, which stays valid for the skipped ones.
  changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      core: ${{ steps.filter.outputs.core }}
      env-computer-graphics: ${{ steps.filter.outputs.env-computer-graphics }}
      env-inleiding-programmeren: ${{ steps.filter.outputs.env-inleiding-programmeren }}
      env-computer-systemen-architectuur: ${{ steps.filter.outputs.env-computer-systemen-architectuur }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select images to build
        id: filter
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Everything is built if the previous commit is unknown (manual run)
          # or unavailable (first push of a branch).
          if [ -n "$BEFORE" ] && git fetch --depth=1 origin "$BEFORE"; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            changed=ALL
          fi

          select_image() {
            if [ "$changed" = ALL ] || grep -qE "$2" <<< "$changed"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }

          select_image core '^(inginious/|deploy/Containerfile$|pyproject\.toml$)'
          select_image env-computer-graphics '^uantwerpen/containers/computer-graphics/'
          select_image env-inleiding-programmeren '^uantwerpen/containers/inleiding-programmeren/'
          select_image env-computer-systemen-architectuur '^uantwerpen/containers/computer-systemen-architectuur/'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Buildx bootstrap attempt ${attempt}/5"
            docker buildx rm ci-builder >/dev/null 2>&1 || true
            if docker buildx create --name ci-builder --driver docker-container --use; then
              if docker buildx inspect --bootstrap; then
                docker buildx ls
                exit 0
              fi
            fi

            sleep_seconds=$((attempt * 10))
            echo "Buildx bootstrap failed, retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done
          echo "Buildx bootstrap failed after 5 attempts"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # env-base and env-default are NOT built here: they are unchanged from
      # upstream and consumed directly from ghcr.io/inginious/env-*:latest
      # (see UPSTREAM_ENV_TAG below and the FROM lines in
      # uantwerpen/containers/*/Dockerfile).

      # Build core images (from deploy/Containerfile with multiple targets)
      - name: Build and push core-backend
        if: needs.changes.outputs.core == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./deploy/Containerfile
          target: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/core-backend:latest
            ${{ env.REGISTRY }}/inginious/core-backend:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      - name: Build and push core-agent_docker
        if: needs.changes.outputs.core == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./deploy/Containerfile
          target: agent_docker
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/core-agent_docker:latest
            ${{ env.REGISTRY }}/inginious/core-agent_docker:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      # core-agent_mcq is NOT built here: it is unchanged from upstream and
      # consumed directly from ghcr.io/inginious/core-agent_mcq (see the
      # agent-mcq service in docker-compose.yml).

      - name: Build and push core-frontend
        if: needs.changes.outputs.core == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./deploy/Containerfile
          target: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/core-frontend:latest
            ${{ env.REGISTRY }}/inginious/core-frontend:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      - name: Build and push env-computer-graphics
        if: needs.changes.outputs.env-computer-graphics == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./uantwerpen/containers/computer-graphics/
          target: env-computer-graphics
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/env-computer-graphics:latest
            ${{ env.REGISTRY }}/inginious/env-computer-graphics:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.UPSTREAM_ENV_TAG }}
            REGISTRY=ghcr.io

      - name: Build and push env-inleiding-programmeren
        if: needs.changes.outputs.env-inleiding-programmeren == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./uantwerpen/containers/inleiding-programmeren/
          target: env-cpp
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/env-inleiding-programmeren:latest
            ${{ env.REGISTRY }}/inginious/env-inleiding-programmeren:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.UPSTREAM_ENV_TAG }}
            REGISTRY=ghcr.io

      - name: Build and push env-computer-systemen-architectuur
        if: needs.changes.outputs.env-computer-systemen-architectuur == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./uantwerpen/containers/computer-systemen-architectuur/
          target: env-computer-systemen-architectuur
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/env-computer-systemen-architectuur:latest
            ${{ env.REGISTRY }}/inginious/env-computer-systemen-architectuur:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.UPSTREAM_ENV_TAG }}
            REGISTRY=ghcr.io
