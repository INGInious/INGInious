name: Build and push docker-compose images

on:
  push:
    branches:
      - main
    paths:
      - base-containers/base/**
      - deploy/Containerfile
      - docker-compose.yml
      - uantwerpen/containers/**
      - inginious/**
      - pyproject.toml
      - .github/workflows/build-docker-compose.yml

  workflow_dispatch:

env:
  REGISTRY: ghcr.io/uantwerpen
  VERSION: ${{ github.sha }}
  # Upstream base env image tag to build our grading containers FROM.
  # "main" is the Rocky 10 base; "latest" is an outdated Rocky 8 image.
  UPSTREAM_ENV_TAG: main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (retry)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Buildx bootstrap attempt ${attempt}/5"
            docker buildx rm ci-builder >/dev/null 2>&1 || true
            if docker buildx create --name ci-builder --driver docker-container --use; then
              if docker buildx inspect --bootstrap; then
                docker buildx ls
                exit 0
              fi
            fi

            sleep_seconds=$((attempt * 10))
            echo "Buildx bootstrap failed, retrying in ${sleep_seconds}s..."
            sleep "${sleep_seconds}"
          done
          echo "Buildx bootstrap failed after 5 attempts"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # env-base and env-default are NOT built here: they are unchanged from
      # upstream and consumed directly from ghcr.io/inginious/env-*:latest
      # (see UPSTREAM_ENV_TAG below and the FROM lines in
      # uantwerpen/containers/*/Dockerfile).

      # Build core images (from deploy/Containerfile with multiple targets)
      - name: Build and push core-backend
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./deploy/Containerfile
          target: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/core-backend:latest
            ${{ env.REGISTRY }}/inginious/core-backend:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      - name: Build and push core-agent_docker
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./deploy/Containerfile
          target: agent_docker
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/core-agent_docker:latest
            ${{ env.REGISTRY }}/inginious/core-agent_docker:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      # core-agent_mcq is NOT built here: it is unchanged from upstream and
      # consumed directly from ghcr.io/inginious/core-agent_mcq (see the
      # agent-mcq service in docker-compose.yml).

      - name: Build and push core-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./deploy/Containerfile
          target: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/core-frontend:latest
            ${{ env.REGISTRY }}/inginious/core-frontend:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REGISTRY=${{ env.REGISTRY }}

      - name: Build and push env-computer-graphics
        uses: docker/build-push-action@v7
        with:
          context: ./uantwerpen/containers/computer-graphics/
          target: env-computer-graphics
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/env-computer-graphics:latest
            ${{ env.REGISTRY }}/inginious/env-computer-graphics:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.UPSTREAM_ENV_TAG }}
            REGISTRY=ghcr.io

      - name: Build and push env-inleiding-programmeren
        uses: docker/build-push-action@v7
        with:
          context: ./uantwerpen/containers/inleiding-programmeren/
          target: env-cpp
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/env-inleiding-programmeren:latest
            ${{ env.REGISTRY }}/inginious/env-inleiding-programmeren:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.UPSTREAM_ENV_TAG }}
            REGISTRY=ghcr.io

      - name: Build and push env-computer-systemen-architectuur
        uses: docker/build-push-action@v7
        with:
          context: ./uantwerpen/containers/computer-systemen-architectuur/
          target: env-computer-systemen-architectuur
          push: true
          tags: |
            ${{ env.REGISTRY }}/inginious/env-computer-systemen-architectuur:latest
            ${{ env.REGISTRY }}/inginious/env-computer-systemen-architectuur:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.UPSTREAM_ENV_TAG }}
            REGISTRY=ghcr.io
